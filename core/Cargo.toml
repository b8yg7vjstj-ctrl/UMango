[workspace]
resolver = "2"
members = [
    "crates/umango-core",
    "crates/umango-adapters",
    "crates/umango-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["UMango contributors"]

[workspace.dependencies]
umango-core = { path = "crates/umango-core" }
umango-adapters = { path = "crates/umango-adapters" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# 阶段1 以编译速度优先：依赖在 debug 下也做轻度优化。
[profile.dev.package."*"]
opt-level = 1
